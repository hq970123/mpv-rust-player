[package]
name = "mpv-rust-player"
version = "0.1.0"
edition = "2021"
description = "High-performance local video player built on libmpv, with live speech recognition and translated subtitles"
license = "MIT"

[[bin]]
name = "filmora-player"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "x11"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
whisper-rs = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.14", features = ["metal"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
